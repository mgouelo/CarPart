name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [stock-api, clients-api]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.app }}/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check syntax and imports
        run: |
          python -m compileall -q .
          python -c "import database, models"

  # Build with Buildah and push to the GitHub Container Registry
  build-buildah-ghcr:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [stock-api, clients-api]
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name
        run: echo "IMAGE=${GHCR_REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/carpart-${{ matrix.app }}" >> "$GITHUB_ENV"
      - name: Build with Buildah
        run: buildah bud -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" ${{ matrix.app }}
      - name: Login to GHCR
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "$GHCR_REGISTRY"
      - name: Push
        run: |
          buildah push "$IMAGE:latest"
          buildah push "$IMAGE:${GITHUB_SHA::7}"

  # Build with Docker and push to Docker Hub
  build-docker-hub:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [stock-api, clients-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carpart-${{ matrix.app }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carpart-${{ matrix.app }}:${{ github.sha }}
